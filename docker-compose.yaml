services:
  fast-api-app:
    build: .
    volumes:
      - ./.dockervenv:/src/.venv
      - ./:/src
    ports:
      - "8000:8000"

  db:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "demo"
      TZ: "Asia/Tokyo"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "33306:3306"

volumes:
  mysql_data:

